name: Apply localized email worker

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - scripts/apply-localized-email-worker.mjs
      - .github/workflows/apply-localized-email-worker.yml

permissions:
  contents: write

concurrency:
  group: localized-email-worker
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-localized-email-worker.mjs
      - name: Commit email worker changes
        run: |
          if git diff --quiet; then
            echo "No email worker changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workers/email.worker.ts
          git commit -m "feat: localize queued email delivery"
          git push origin HEAD:${{ github.head_ref }}
