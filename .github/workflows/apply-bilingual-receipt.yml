name: Apply bilingual receipt

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - scripts/apply-bilingual-receipt.mjs
      - .github/workflows/apply-bilingual-receipt.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-bilingual-receipt.mjs
      - name: Commit receipt controller
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/invoices/invoices.workspace.controller.ts
          git commit -m "feat: generate bilingual payment receipts"
          git push origin HEAD:${{ github.head_ref }}
