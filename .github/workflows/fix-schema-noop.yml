name: One-off schema cleanup

on:
  push:
    branches: [agent/financial-runtime-cleanup]
    paths: [.github/workflows/fix-schema-noop.yml]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/financial-runtime-cleanup
      - name: Remove redundant InsuranceClaim id unique marker
        run: sed -i 's/id          String   @id @default(uuid()) @db.Uuid @unique/id          String   @id @default(uuid()) @db.Uuid/' prisma/schema.prisma
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "chore: remove redundant schema uniqueness" || exit 0
          git push origin HEAD:agent/financial-runtime-cleanup
