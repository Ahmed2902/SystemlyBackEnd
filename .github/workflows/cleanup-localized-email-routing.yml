name: Clean localized email routing migration

on:
  push:
    branches: [feat/platform-language-preferences]
    paths:
      - src/shared/services/email.service.ts

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-language-preferences
          fetch-depth: 0
      - name: Remove one-time migration files
        run: |
          if ! grep -q 'const requestedLocale = payload.locale ?? payload.businessLanguage' src/shared/services/email.service.ts; then
            exit 0
          fi
          rm -f scripts/finalize-localized-email-routing.mjs
          rm -f .github/workflows/finalize-localized-email-routing.yml
          rm -f .github/workflows/cleanup-localized-email-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary email routing migration"
          git push origin HEAD:feat/platform-language-preferences
