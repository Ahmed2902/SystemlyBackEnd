name: Report backend localization errors

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - .github/workflows/report-localization-errors.yml
      - src/**
      - prisma/**
      - tests/localization.contract.test.ts
      - package.json
      - package-lock.json

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/systemly
      NODE_ENV: test
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CSRF_SECRET: ci-csrf-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Run backend localization checks
        id: check
        shell: bash
        run: |
          set +e
          {
            npm run build
            npm test -- --runInBand tests/localization.contract.test.ts
            npm run validate:openapi
          } > /tmp/backend-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report failure
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Backend localization CI diagnostics'
            echo
            echo '```text'
            tail -n 220 /tmp/backend-check.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/comment.md
      - name: Remove temporary migration and diagnostic files after success
        if: steps.check.outputs.status == '0'
        run: |
          rm -f .github/workflows/report-localization-errors.yml
          rm -f .github/workflows/finalize-localized-email-routing.yml
          rm -f .github/workflows/cleanup-localized-email-routing.yml
          rm -f scripts/finalize-localized-email-routing.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary backend diagnostics" || exit 0
          git push origin HEAD:${{ github.head_ref }}
