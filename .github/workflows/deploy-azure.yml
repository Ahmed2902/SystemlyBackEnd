name: Deploy Backend to Azure

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

concurrency:
  group: systemly-production-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Migrate and deploy API
    if: >-
      vars.AZURE_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: Production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}

    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install migration dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP Production variable}"
          : "${AZURE_CONTAINER_REGISTRY:?Set the AZURE_CONTAINER_REGISTRY Production variable}"
          : "${AZURE_API_APP:?Set the AZURE_API_APP Production variable}"
          : "${DATABASE_MIGRATION_URL:?Set the DATABASE_MIGRATION_URL Production secret}"
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Build and push the tested image
        shell: bash
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --source-acr-auth-id '[caller]' \
            --image "systemly-backend:$DEPLOY_SHA" \
            .

      - name: Resolve registry login server
        shell: bash
        run: |
          set -euo pipefail
          acr_login_server="$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --query loginServer \
            --output tsv)"

          if [ -z "$acr_login_server" ]; then
            echo "Could not resolve the Azure Container Registry login server." >&2
            exit 1
          fi

          echo "ACR_LOGIN_SERVER=$acr_login_server" >> "$GITHUB_ENV"

      - name: Apply production application migrations
        run: npm run prisma:migrate:deploy
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}

      - name: Apply production worker migrations
        run: npm run graphile:migrate
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}

      - name: Configure Container App registry access
        shell: bash
        run: |
          set -euo pipefail
          principal_id="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" \
            --query identity.principalId \
            --output tsv)"

          if [ -z "$principal_id" ] || [ "$principal_id" = "None" ]; then
            echo "The Container App must have a system-assigned managed identity before deployment." >&2
            exit 1
          fi

          az containerapp registry set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" \
            --server "$ACR_LOGIN_SERVER" \
            --identity system

      - name: Deploy API revision
        shell: bash
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/systemly-backend:$DEPLOY_SHA"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" \
            --image "$image" \
            --min-replicas 1 \
            --max-replicas 1 \
            --set-env-vars \
              "NODE_ENV=production" \
              "PORT=3000" \
              "EMAIL_DELIVERY_MODE=worker" \
              "SENTRY_ENV=production" \
              "SENTRY_RELEASE=systemly-backend@$DEPLOY_SHA"

      - name: Configure production ingress
        shell: bash
        run: |
          set -euo pipefail
          az containerapp ingress update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" \
            --type external \
            --target-port 3000 \
            --transport auto \
            --allow-insecure false

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              "https://$fqdn/health/ready"; then
              echo
              echo "API is ready at https://$fqdn"
              exit 0
            fi
            echo "Readiness attempt $attempt/30 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "API did not become ready in time."
          exit 1

      - name: Deployment summary
        run: |
          echo "### Systemly backend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sentry release: \`systemly-backend@$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Prisma and Graphile Worker migrations: applied before rollout" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime database URL: configured separately on the Container App" >> "$GITHUB_STEP_SUMMARY"
          echo "- ACR quick build: caller identity (ABAC-compatible)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ACR login server: resolved from Azure (DNL-safe)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ACR image pull: system-assigned managed identity" >> "$GITHUB_STEP_SUMMARY"
          echo "- External HTTPS ingress: target port 3000" >> "$GITHUB_STEP_SUMMARY"
          echo "- API app: \`$AZURE_API_APP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production scaling: min replicas 1, max replicas 1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Embedded Graphile email worker: forced to worker mode and kept continuously available" >> "$GITHUB_STEP_SUMMARY"
