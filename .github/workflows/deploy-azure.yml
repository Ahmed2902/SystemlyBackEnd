name: Deploy Backend to Azure

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: systemly-production-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Migrate and deploy API and worker
    if: >-
      vars.AZURE_DEPLOY_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      AZURE_WORKER_APP: ${{ vars.AZURE_WORKER_APP }}

    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install migration dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP production variable}"
          : "${AZURE_CONTAINER_REGISTRY:?Set the AZURE_CONTAINER_REGISTRY production variable}"
          : "${AZURE_API_APP:?Set the AZURE_API_APP production variable}"
          : "${AZURE_WORKER_APP:?Set the AZURE_WORKER_APP production variable}"
          : "${PRODUCTION_DATABASE_URL:?Set the PRODUCTION_DATABASE_URL production secret}"
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Build and push the tested image
        shell: bash
        run: |
          set -euo pipefail
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "systemly-backend:$DEPLOY_SHA" \
            .

      - name: Apply production database migrations
        run: npm run prisma:migrate:deploy
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy API revision
        shell: bash
        run: |
          set -euo pipefail
          image="$AZURE_CONTAINER_REGISTRY.azurecr.io/systemly-backend:$DEPLOY_SHA"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" \
            --image "$image"

      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_API_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://$fqdn/health/ready"; then
              echo
              echo "API is ready at https://$fqdn"
              exit 0
            fi
            echo "Readiness attempt $attempt/30 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "API did not become ready in time."
          exit 1

      - name: Deploy worker revision
        shell: bash
        run: |
          set -euo pipefail
          image="$AZURE_CONTAINER_REGISTRY.azurecr.io/systemly-backend:$DEPLOY_SHA"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WORKER_APP" \
            --image "$image"

      - name: Deployment summary
        run: |
          echo "### Systemly backend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migrations: applied before rollout" >> "$GITHUB_STEP_SUMMARY"
          echo "- API app: \`$AZURE_API_APP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker app: \`$AZURE_WORKER_APP\`" >> "$GITHUB_STEP_SUMMARY"
