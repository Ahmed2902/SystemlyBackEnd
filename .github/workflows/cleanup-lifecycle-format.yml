name: One-off lifecycle formatting

on:
  push:
    branches: [agent/booking-onboarding-correctness]
    paths: [.github/workflows/cleanup-lifecycle-format.yml]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-onboarding-correctness
      - name: Remove redundant booking lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/bookings/bookings.service.ts')
          text = path.read_text()
          old = '''    await requireBookableBusiness(businessId);

          const business = await prisma.business.findUnique({
            where: { id: businessId },
          });
          if (!business) throw notFoundError("Business not found");'''
          if old not in text:
              old = '''    await requireBookableBusiness(businessId);

    const business = await prisma.business.findUnique({
      where: { id: businessId },
    });
    if (!business) throw notFoundError("Business not found");'''
          if old not in text:
              raise RuntimeError('booking lookup anchor not found')
          text = text.replace(old, '    const business = await requireBookableBusiness(businessId);', 1)
          path.write_text(text)
          PY
      - name: Format touched lifecycle files
        run: npx --yes prettier@3.6.2 --write src/modules/appointments/appointments.command.service.ts src/modules/bookings/bookings.service.ts tests/booking-onboarding-correctness.integration.test.ts
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/appointments/appointments.command.service.ts src/modules/bookings/bookings.service.ts tests/booking-onboarding-correctness.integration.test.ts
          git commit -m "chore: normalize lifecycle hardening changes"
          git push origin HEAD:agent/booking-onboarding-correctness
