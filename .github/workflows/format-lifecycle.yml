name: Format lifecycle hardening

on:
  push:
    branches:
      - agent/booking-onboarding-correctness
    paths:
      - .github/workflows/format-lifecycle.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/booking-onboarding-correctness
      - name: Format files
        run: npx --yes prettier@3.6.2 --write src/modules/appointments/appointments.command.service.ts src/modules/bookings/bookings.service.ts tests/booking-onboarding-correctness.integration.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/appointments/appointments.command.service.ts src/modules/bookings/bookings.service.ts tests/booking-onboarding-correctness.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: format lifecycle hardening"
          git push origin HEAD:agent/booking-onboarding-correctness
