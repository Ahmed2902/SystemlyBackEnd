name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Generate, build, validate OpenAPI and container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hgezli_ci?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Build TypeScript
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate OpenAPI
        run: |
          set -o pipefail
          npm run validate:openapi 2>&1 | tee openapi.log

      - name: Upload OpenAPI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-openapi-diagnostics
          path: openapi.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build production container
        run: docker build --tag systemly-backend:ci .

  test:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hgezli_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hgezli_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hgezli_ci?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CSRF_SECRET: ci-csrf-secret
      FRONTEND_URL: http://localhost:3000
      EMAIL_TEST_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify migration history matches Prisma schema
        env:
          PGPASSWORD: postgres
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hgezli_shadow?schema=public
        run: |
          set -euo pipefail
          dropdb --if-exists --host=localhost --username=postgres hgezli_shadow
          createdb --host=localhost --username=postgres hgezli_shadow
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee tests.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: tests.log
          if-no-files-found: ignore
          retention-days: 3

  container-smoke:
    name: Smoke-test production container
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hgezli_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hgezli_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hgezli_smoke?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CSRF_SECRET: ci-csrf-secret
      FRONTEND_URL: http://localhost:3000
      EMAIL_TEST_MODE: "true"
      LOG_IN_TESTS: "true"
      PORT: "3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag systemly-backend:smoke .

      - name: Apply application and worker migrations with production image
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e NODE_ENV \
            -e DATABASE_URL \
            systemly-backend:smoke \
            npm run prisma:migrate:deploy
          docker run --rm --network host \
            -e NODE_ENV \
            -e DATABASE_URL \
            systemly-backend:smoke \
            npm run graphile:migrate

      - name: Start production image
        run: >-
          docker run --detach --name systemly-smoke --network host
          -e NODE_ENV
          -e DATABASE_URL
          -e JWT_SECRET
          -e JWT_REFRESH_SECRET
          -e CSRF_SECRET
          -e FRONTEND_URL
          -e EMAIL_TEST_MODE
          -e LOG_IN_TESTS
          -e PORT
          systemly-backend:smoke

      - name: Verify non-root runtime and health probes
        run: |
          set -euo pipefail
          test "$(docker exec systemly-smoke id -u)" != "0"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs systemly-smoke
          exit 1

      - name: Print container diagnostics
        if: failure()
        run: |
          docker inspect systemly-smoke || true
          docker logs systemly-smoke || true

      - name: Stop production image
        if: always()
        run: docker rm --force systemly-smoke || true
