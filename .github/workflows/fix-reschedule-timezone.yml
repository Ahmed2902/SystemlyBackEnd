name: One-off reschedule timezone normalization

on:
  push:
    branches: [agent/booking-onboarding-correctness]
    paths: [.github/workflows/fix-reschedule-timezone.yml]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-onboarding-correctness
      - name: Normalize reschedule parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/appointments/appointments.command.service.ts')
          text = path.read_text()
          text = text.replace(
              'import { getBusinessDayRange } from "../../shared/utils/timezone";',
              'import {\n  getBusinessDayRange,\n  toUtcFromBusinessTime,\n} from "../../shared/utils/timezone";',
          )
          text = text.replace(
              '      let segmentStart = new Date(startsAt);',
              '      let segmentStart = toUtcFromBusinessTime(\n        startsAt,\n        appt.business.timezone,\n      );',
          )
          path.write_text(text)
          PY
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/appointments/appointments.command.service.ts
          git commit -m "fix: normalize reschedule time in business timezone" || exit 0
          git push origin HEAD:agent/booking-onboarding-correctness
