name: Finalize localized email routing

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - scripts/finalize-localized-email-routing.mjs
      - .github/workflows/finalize-localized-email-routing.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/finalize-localized-email-routing.mjs
      - name: Commit routing changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/services/email.service.ts
          git commit -m "fix: route localized emails by the correct preference"
          git push origin HEAD:${{ github.head_ref }}
