name: PR 59 Validation

on:
  push:
    branches: [agent/storage-and-azure-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hgezli_pr59
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hgezli_pr59"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hgezli_pr59?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CSRF_SECRET: ci-csrf-secret
      FRONTEND_URL: http://localhost:3000
      EMAIL_TEST_MODE: "true"
      LOG_IN_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm run validate:openapi
      - run: npm run prisma:migrate:deploy
      - run: npm test
      - run: docker build --tag systemly-backend:pr59 .
      - name: Verify production image runs as non-root
        run: test "$(docker run --rm systemly-backend:pr59 id -u)" != "0"
