name: One-off appointment lifecycle hardening

on:
  push:
    branches: [agent/booking-onboarding-correctness]
    paths: [.github/workflows/harden-appointment-transitions.yml]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-onboarding-correctness
      - name: Apply atomic lifecycle transitions and concurrency tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise RuntimeError(f"start marker not found: {start}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise RuntimeError(f"end marker not found: {end}")
              return text[:start_index] + replacement + text[end_index:]

          command_path = Path('src/modules/appointments/appointments.command.service.ts')
          text = command_path.read_text()

          helper_anchor = '''function withCurrentInvoice<T extends { invoices: unknown[] }>({
            invoices,
            ...appointment
          }: T) {
            return { ...appointment, invoice: invoices[0] ?? null };
          }
          '''
          helper = helper_anchor + '''
          async function transitionAppointmentStatus(
            tx: Prisma.TransactionClient,
            appointmentId: string,
            businessId: string,
            fromStatus: AppointmentStatus,
            toStatus: AppointmentStatus,
            data: Prisma.AppointmentUpdateManyMutationInput = {},
          ) {
            const result = await tx.appointment.updateMany({
              where: { id: appointmentId, businessId, status: fromStatus },
              data: { ...data, status: toStatus },
            });
            return result.count === 1;
          }
          '''
          if helper_anchor not in text:
              raise RuntimeError('withCurrentInvoice anchor not found')
          text = text.replace(helper_anchor, helper, 1)

          text = replace_between(
              text,
              '  async updateStatus(',
              '  async updateNotes(',
              '''  async updateStatus(
            id: string,
            status: "pending" | "confirmed" | "in_progress" | "no_show",
            businessId: string,
          ) {
            return prisma.$transaction(async (tx) => {
              const appt = await getOwnedAppointmentOrThrow(tx, id, businessId, {
                customer: true,
                invoices: {
                  where: { status: { not: InvoiceStatus.voided } },
                  orderBy: { issuedAt: "desc" },
                  take: 1,
                },
              });
              assertEditable(appt);

              if (appt.status === status) return appt;

              if (
                status === AppointmentStatus.no_show &&
                appt.status === AppointmentStatus.in_progress
              ) {
                throw invalidStateError(
                  "An in-progress appointment cannot be marked as no-show",
                  "INVALID_APPOINTMENT_STATE",
                  409,
                );
              }

              const transitioned = await transitionAppointmentStatus(
                tx,
                id,
                businessId,
                appt.status,
                status,
              );
              if (!transitioned) {
                const current = await getOwnedAppointmentOrThrow(tx, id, businessId);
                if (current.status === status) return current;
                throw invalidStateError(
                  "Appointment state changed while updating status",
                  "APPOINTMENT_STATE_CHANGED",
                  409,
                );
              }

              if (
                appt.status === AppointmentStatus.no_show &&
                appt.customerId &&
                appt.customer?.noShowCount > 0
              ) {
                await tx.customer.update({
                  where: { id: appt.customerId },
                  data: { noShowCount: { decrement: 1 } },
                });
              }
              if (status === AppointmentStatus.no_show && appt.customerId) {
                await tx.customer.update({
                  where: { id: appt.customerId },
                  data: { noShowCount: { increment: 1 } },
                });
              }

              return tx.appointment.findUniqueOrThrow({ where: { id } });
            });
          }

          ''',
          )

          text = replace_between(
              text,
              '  async finishAppointment(',
              '  async cancelAppointment(',
              '''  async finishAppointment(
            appointmentId: string,
            businessId: string,
            payload: FinishAppointmentInput,
          ) {
            return prisma.$transaction(async (tx) => {
              const appointment = await getOwnedAppointmentOrThrow(
                tx,
                appointmentId,
                businessId,
                { business: true },
              );

              if (appointment.status === AppointmentStatus.completed) {
                return tx.appointment.findUniqueOrThrow({
                  where: { id: appointmentId },
                });
              }

              if (
                appointment.status !== AppointmentStatus.pending &&
                appointment.status !== AppointmentStatus.confirmed &&
                appointment.status !== AppointmentStatus.in_progress
              ) {
                throw invalidStateError(
                  "This appointment cannot be completed in its current state",
                  "INVALID_APPOINTMENT_STATE",
                  409,
                );
              }

              const transitioned = await transitionAppointmentStatus(
                tx,
                appointmentId,
                businessId,
                appointment.status,
                AppointmentStatus.completed,
                { notes: payload?.notes },
              );
              if (!transitioned) {
                const current = await getOwnedAppointmentOrThrow(
                  tx,
                  appointmentId,
                  businessId,
                );
                if (current.status === AppointmentStatus.completed) return current;
                throw invalidStateError(
                  "Appointment state changed while completing it",
                  "APPOINTMENT_STATE_CHANGED",
                  409,
                );
              }

              await tx.customer.update({
                where: { id: appointment.customerId },
                data: {
                  visitCount: { increment: 1 },
                  lastVisitAt: appointment.startsAt,
                },
              });

              if (payload.photos?.length) {
                for (const photo of payload.photos) {
                  const photoRow = await tx.photo.create({
                    data: {
                      businessId,
                      url: photo.url,
                      publicId: photo.publicId,
                      kind: "appointment",
                      type: photo.type,
                    },
                  });
                  await tx.appointmentPhoto.create({
                    data: { appointmentId, photoId: photoRow.id, type: photo.type },
                  });
                }
              }

              if (
                isModuleEnabled(
                  appointment.business.vertical ?? "",
                  "clinicalRecords",
                ) &&
                payload.clinical
              ) {
                await tx.clinicVisitRecord.upsert({
                  where: { appointmentId },
                  create: {
                    appointmentId,
                    notes: payload.clinical.notes,
                    diagnosis: payload.clinical.diagnosis,
                    prescriptionJson: payload.clinical.prescriptionJson,
                  },
                  update: {
                    notes: payload.clinical.notes,
                    diagnosis: payload.clinical.diagnosis,
                    prescriptionJson: payload.clinical.prescriptionJson,
                  },
                });
              }

              return tx.appointment.findUniqueOrThrow({
                where: { id: appointmentId },
              });
            });
          }

          ''',
          )

          text = replace_between(
              text,
              '  async cancelAppointment(',
              '  async deleteCancelledAppointment(',
              '''  async cancelAppointment(
            id: string,
            businessId: string,
            payload: CancelAppointmentBody,
          ) {
            return prisma.$transaction(async (tx) => {
              const appt = await getOwnedAppointmentOrThrow(tx, id, businessId);

              if (isCancelled(appt.status)) {
                throw invalidStateError(
                  "Appointment is already cancelled",
                  "ALREADY_CANCELLED",
                );
              }
              if (
                appt.status !== AppointmentStatus.pending &&
                appt.status !== AppointmentStatus.confirmed
              ) {
                throw invalidStateError(
                  "Only pending or confirmed appointments can be cancelled",
                  "INVALID_APPOINTMENT_STATE",
                  409,
                );
              }

              const notes = payload.reason
                ? `${appt.notes ? appt.notes + " | " : ""}Cancelled: ${payload.reason}`
                : appt.notes;
              const transitioned = await transitionAppointmentStatus(
                tx,
                id,
                businessId,
                appt.status,
                AppointmentStatus.cancelled_by_business,
                { notes },
              );
              if (!transitioned) {
                const current = await getOwnedAppointmentOrThrow(tx, id, businessId);
                if (isCancelled(current.status)) {
                  throw invalidStateError(
                    "Appointment is already cancelled",
                    "ALREADY_CANCELLED",
                  );
                }
                throw invalidStateError(
                  "Appointment state changed while cancelling it",
                  "APPOINTMENT_STATE_CHANGED",
                  409,
                );
              }

              await voidInvoiceIfPaid(tx, id);
              return tx.appointment.findUniqueOrThrow({ where: { id } });
            });
          }

          ''',
          )

          text = replace_between(
              text,
              '  async uncancelAppointment(',
              '  async revertAppointment(',
              '''  async uncancelAppointment(id: string, businessId: string) {
            return prisma.$transaction(async (tx) => {
              const appt = await getOwnedAppointmentOrThrow(tx, id, businessId);

              if (!isCancelled(appt.status)) {
                throw invalidStateError("Appointment is not cancelled");
              }

              const transitioned = await transitionAppointmentStatus(
                tx,
                id,
                businessId,
                appt.status,
                AppointmentStatus.confirmed,
              );
              if (!transitioned) {
                const current = await getOwnedAppointmentOrThrow(tx, id, businessId);
                if (current.status === AppointmentStatus.confirmed) return current;
                throw invalidStateError(
                  "Appointment state changed while restoring it",
                  "APPOINTMENT_STATE_CHANGED",
                  409,
                );
              }

              return tx.appointment.findUniqueOrThrow({ where: { id } });
            });
          }

          ''',
          )

          text = replace_between(
              text,
              '  async revertAppointment(',
              '  async markNoShowManual(',
              '''  async revertAppointment(apptId: string, businessId: string) {
            return prisma.$transaction(async (tx) => {
              const appt = await getOwnedAppointmentOrThrow(tx, apptId, businessId);

              if (isCancelled(appt.status)) {
                throw invalidStateError(
                  "Cannot revert a cancelled appointment — it was never completed or paid",
                );
              }

              const wasNoShow = appt.status === AppointmentStatus.no_show;
              const wasCompleted = appt.status === AppointmentStatus.completed;
              const transitioned = await transitionAppointmentStatus(
                tx,
                apptId,
                businessId,
                appt.status,
                AppointmentStatus.confirmed,
              );
              if (!transitioned) {
                const current = await getOwnedAppointmentOrThrow(
                  tx,
                  apptId,
                  businessId,
                );
                if (current.status === AppointmentStatus.confirmed) {
                  return { ...current, wasNoShow: false, wasCompleted: false };
                }
                if (isCancelled(current.status)) {
                  throw invalidStateError(
                    "Cannot revert a cancelled appointment — it was never completed or paid",
                  );
                }
                throw invalidStateError(
                  "Appointment state changed while reverting it",
                  "APPOINTMENT_STATE_CHANGED",
                  409,
                );
              }

              if (
                wasNoShow &&
                appt.customerId &&
                appt.customer &&
                appt.customer.noShowCount > 0
              ) {
                await tx.customer.update({
                  where: { id: appt.customerId },
                  data: { noShowCount: { decrement: 1 } },
                });
              }

              await voidInvoiceIfPaid(tx, apptId);

              if (wasCompleted && appt.customerId) {
                const latestCompleted = await tx.appointment.findFirst({
                  where: {
                    businessId,
                    customerId: appt.customerId,
                    status: AppointmentStatus.completed,
                    id: { not: apptId },
                  },
                  orderBy: { startsAt: "desc" },
                  select: { startsAt: true },
                });

                await tx.customer.update({
                  where: { id: appt.customerId },
                  data: {
                    ...(appt.customer && appt.customer.visitCount > 0
                      ? { visitCount: { decrement: 1 } }
                      : {}),
                    lastVisitAt: latestCompleted?.startsAt ?? null,
                  },
                });
              }

              const updated = await tx.appointment.findUniqueOrThrow({
                where: { id: apptId },
              });
              return { ...updated, wasNoShow, wasCompleted };
            });
          }

          ''',
          )

          text = replace_between(
              text,
              '  async markNoShowManual(',
              '}\n\nexport default new AppointmentsCommandService();',
              '''  async markNoShowManual(id: string, businessId: string) {
            return prisma.$transaction(async (tx) => {
              const appt = await getOwnedAppointmentOrThrow(tx, id, businessId);

              if (
                appt.status !== AppointmentStatus.confirmed &&
                appt.status !== AppointmentStatus.pending
              ) {
                throw invalidStateError(
                  "Only pending or confirmed appointments can be marked no-show",
                  "INVALID_APPOINTMENT_STATE",
                  409,
                );
              }

              const transitioned = await transitionAppointmentStatus(
                tx,
                id,
                businessId,
                appt.status,
                AppointmentStatus.no_show,
              );
              if (!transitioned) {
                const current = await getOwnedAppointmentOrThrow(tx, id, businessId);
                if (current.status === AppointmentStatus.no_show) return current;
                throw invalidStateError(
                  "Appointment state changed while marking no-show",
                  "APPOINTMENT_STATE_CHANGED",
                  409,
                );
              }

              if (appt.customerId) {
                await tx.customer.update({
                  where: { id: appt.customerId },
                  data: { noShowCount: { increment: 1 } },
                });
              }

              return tx.appointment.findUniqueOrThrow({ where: { id } });
            });
          }
          ''',
          )
          command_path.write_text(text)

          bookings_path = Path('src/modules/bookings/bookings.service.ts')
          bookings = bookings_path.read_text()
          old_cancel = '''      return tx.appointment.update({
                where: { id: appointment.id },
                data: { status: AppointmentStatus.cancelled_by_customer },
              });'''
          new_cancel = '''      const transitioned = await tx.appointment.updateMany({
                where: {
                  id: appointment.id,
                  status: appointment.status,
                },
                data: { status: AppointmentStatus.cancelled_by_customer },
              });
              if (transitioned.count === 1) {
                return tx.appointment.findUniqueOrThrow({
                  where: { id: appointment.id },
                });
              }

              const current = await tx.appointment.findUniqueOrThrow({
                where: { id: appointment.id },
              });
              if (current.status === AppointmentStatus.cancelled_by_customer) {
                return current;
              }
              throw invalidStateError(
                "This appointment can no longer be cancelled by the customer",
                "INVALID_APPOINTMENT_STATE",
                409,
              );'''
          if bookings.count(old_cancel) != 1:
              raise RuntimeError('public cancellation update anchor not found')
          bookings_path.write_text(bookings.replace(old_cancel, new_cancel, 1))

          test_path = Path('tests/booking-onboarding-correctness.integration.test.ts')
          tests = test_path.read_text()
          anchor = '''  test("uncancelling does not count a visit", async () => {'''
          concurrent_tests = '''  test("concurrent completion and revert adjust visitCount exactly once", async () => {
            const { business, customer, appointment } =
              await createAppointmentFixture(AppointmentStatus.confirmed);

            await Promise.all([
              appointmentsCommandService.finishAppointment(
                appointment.id,
                business.id,
                {},
              ),
              appointmentsCommandService.finishAppointment(
                appointment.id,
                business.id,
                {},
              ),
            ]);

            let reloadedCustomer = await prisma.customer.findUniqueOrThrow({
              where: { id: customer.id },
            });
            expect(reloadedCustomer.visitCount).toBe(4);

            await Promise.all([
              appointmentsCommandService.revertAppointment(
                appointment.id,
                business.id,
              ),
              appointmentsCommandService.revertAppointment(
                appointment.id,
                business.id,
              ),
            ]);

            reloadedCustomer = await prisma.customer.findUniqueOrThrow({
              where: { id: customer.id },
            });
            const reloadedAppointment = await prisma.appointment.findUniqueOrThrow({
              where: { id: appointment.id },
            });
            expect(reloadedCustomer.visitCount).toBe(3);
            expect(reloadedAppointment.status).toBe(AppointmentStatus.confirmed);
          });

          test("completion cannot race into a cancelled state with a counted visit", async () => {
            const { business, customer, appointment } =
              await createAppointmentFixture(AppointmentStatus.confirmed);

            const results = await Promise.allSettled([
              appointmentsCommandService.finishAppointment(
                appointment.id,
                business.id,
                {},
              ),
              appointmentsCommandService.cancelAppointment(
                appointment.id,
                business.id,
                {},
              ),
            ]);

            expect(results.filter((result) => result.status === "fulfilled")).toHaveLength(1);
            const [reloadedAppointment, reloadedCustomer] = await Promise.all([
              prisma.appointment.findUniqueOrThrow({ where: { id: appointment.id } }),
              prisma.customer.findUniqueOrThrow({ where: { id: customer.id } }),
            ]);

            if (reloadedAppointment.status === AppointmentStatus.completed) {
              expect(reloadedCustomer.visitCount).toBe(4);
            } else {
              expect(reloadedAppointment.status).toBe(
                AppointmentStatus.cancelled_by_business,
              );
              expect(reloadedCustomer.visitCount).toBe(3);
            }
          });

          '''
          if tests.count(anchor) != 1:
              raise RuntimeError('test insertion anchor not found')
          test_path.write_text(tests.replace(anchor, concurrent_tests + anchor, 1))
          PY
      - name: Commit lifecycle hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/appointments/appointments.command.service.ts src/modules/bookings/bookings.service.ts tests/booking-onboarding-correctness.integration.test.ts
          git commit -m "fix: make appointment lifecycle transitions atomic"
          git push origin HEAD:agent/booking-onboarding-correctness
